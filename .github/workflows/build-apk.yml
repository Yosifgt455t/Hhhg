name: Build & Export Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter & Android Environment
        run: flutter doctor -v

      - name: Setup Android Project Scaffolding
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found. Generating platform files..."
            mkdir -p /tmp/flutter_backup
            cp -r lib /tmp/flutter_backup/
            cp pubspec.yaml /tmp/flutter_backup/

            flutter create . --platforms=android --org com.example.flutterdemo --project-name flutter_demo_app

            cp -rf /tmp/flutter_backup/lib/* lib/
            cp -f /tmp/flutter_backup/pubspec.yaml pubspec.yaml
            rm -rf /tmp/flutter_backup
            echo "Android platform files generated successfully."
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK for Artifact Upload
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/FlutterDemoApp-v1.0.0.apk
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlutterDemoApp-v1.0.0-APK
          path: output/FlutterDemoApp-v1.0.0.apk
          retention-days: 14
